<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>
  (function () {
    var saved = localStorage.getItem('theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<title>Contact Verification</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <div class="header-row">
      <h1>Contact Verification</h1>
      <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to light mode">🌙</button>
    </div>
    <p class="subtitle">Check whether a phone number or email address is real and deliverable.</p>

    <section class="form-group">
      <label for="phone">Phone number</label>
      <div class="row">
        <input type="tel" id="phone" placeholder="+14158586273" />
        <button id="phone-btn">Verify</button>
      </div>
      <div id="phone-result" class="result"></div>
    </section>

    <section class="form-group">
      <label for="email">Email address</label>
      <div class="row">
        <input type="email" id="email" placeholder="name@example.com" />
        <button id="email-btn">Verify</button>
      </div>
      <div id="email-result" class="result"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
